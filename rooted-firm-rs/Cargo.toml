[package]
edition      = "2024"
name         = "rooted"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "rooted"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32", "unstable"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
critical-section = "1.2.0"
embedded-hal = "1.0.0"
log = "0.4.33"
esp-println = { version = "0.17.0", features = ["esp32", "log-04", "timestamp"] }
nb = "1.1.0"
esp-alloc = {version = "0.10.0", features = ["esp32"]}
esp-rtos = { version = "0.3.0", features = ["esp32", "esp-radio", "esp-alloc", "embassy"]}
esp-radio = { version = "0.18.0", features = ["esp32", "wifi", "esp-now", "esp-alloc", "unstable"] }
reqwless = "0.14.0"
embassy-net = { version = "0.9.1", features = ["tcp", "udp", "dns", "dhcpv4", "medium-ethernet", "proto-ipv4"] }
embassy-executor = "0.10"
embassy-time = "0.5.1"
static_cell = "2.1.1"
heapless = "0.9.3"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
